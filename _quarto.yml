project:
  type: website
  output-dir: _site
  render:
    - index.qmd

execute:
  freeze: false

website:
  title: "Кредитный скоринг (PD)"
  site-url: "https://wickedstacy085.github.io/credit-scoring"
  repo-url: "https://github.com/wickedstacy085/credit-scoring"
  open-graph: true
  navbar:
    left:
      - href: "https://wickedstacy085.github.io/"
        text: "← Все проекты"
    right:
      - icon: github
        href: "https://github.com/wickedstacy085/credit-scoring"
        aria-label: GitHub
  page-footer:
    left: "Анастасия Смирнова, 2026 · данные UCI, CC BY 4.0"
    right: "[Код проекта](https://github.com/wickedstacy085/credit-scoring)"

format:
  html:
    theme:
      light: [cosmo, assets/custom.scss]
      dark: [darkly, assets/custom.scss]
    toc: true
    code-fold: true
    code-copy: true
    fig-width: 8
    fig-height: 4.5
    lang: ru
